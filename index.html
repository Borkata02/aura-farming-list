<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Farming List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
      <h1 class="text-2xl font-black text-indigo-400">✨ Aura Leaderboard</h1>
      <div id="user-info" class="hidden flex items-center gap-3">
        <span id="user-name" class="font-semibold text-slate-300"></span>
        <button id="logout-btn" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition">Изход</button>
      </div>
    </header>

    <!-- СЕКЦИЯ: Вход / Регистрация -->
    <div id="auth-section" class="max-w-md mx-auto bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-2xl">
      <h2 class="text-xl font-bold text-center mb-4 text-indigo-400">Вход в системата</h2>
      <div id="auth-message" class="hidden p-3 rounded mb-4 text-sm font-medium"></div>

      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Имейл</label>
          <input type="email" id="email" required class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div id="username-container" class="hidden">
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Вашето Име</label>
          <input type="text" id="username" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Парола</label>
          <input type="password" id="password" required class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded text-white focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded transition">Вход</button>
      </form>

      <button id="toggle-mode-btn" class="w-full text-center mt-4 text-xs text-indigo-400 hover:underline">
        Нямате акаунт? Поискайте достъп тук.
      </button>
    </div>

    <!-- СЕКЦИЯ: Dashboard -->
    <div id="dashboard-section" class="hidden space-y-6">
      
      <!-- АДМИН ПАНЕЛ -->
      <div id="admin-panel" class="hidden bg-slate-800/80 border border-amber-500/30 p-5 rounded-xl shadow-lg">
        <h3 class="text-lg font-bold text-amber-400 mb-3 flex items-center gap-2">🛡️ Админ Панел (Промяна на Аура)</h3>
        <form id="aura-form" class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <select id="target-user" required class="bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none text-white">
            <option value="">Изберете колега...</option>
          </select>
          <input type="number" id="aura-points" placeholder="Точки (напр. 500 или -200)" required class="bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none text-white">
          <input type="text" id="aura-reason" placeholder="Причина (напр. 'Донесе понички')" required class="bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none text-white">
          <button type="submit" class="bg-amber-600 hover:bg-amber-500 font-bold p-2.5 rounded text-sm transition">Приложи</button>
        </form>
      </div>

      <!-- КЛАСАЦИЯ -->
      <div class="bg-slate-800 rounded-xl p-5 border border-slate-700 shadow-lg">
        <h3 class="text-lg font-bold text-slate-200 mb-4">🏆 Класация за Месеца</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-700 text-xs text-slate-400 uppercase">
                <th class="p-3">#</th>
                <th class="p-3">Колега</th>
                <th class="p-3 text-right">Аура</th>
              </tr>
            </thead>
            <tbody id="leaderboard-body">
              <!-- Динамични данни -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- ХРОНОЛОГИЯ (FEED) -->
      <div class="bg-slate-800 rounded-xl p-5 border border-slate-700 shadow-lg">
        <h3 class="text-lg font-bold text-slate-200 mb-4">📜 Последна активност</h3>
        <div id="logs-container" class="space-y-3 text-sm">
          <!-- Динамични данни -->
        </div>
      </div>

    </div>

  </div>

<script>
  const SUPABASE_URL = 'https://gemfaemxsdmyqawclmyv.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_W4X4NAdj2b5S4fNdVJFStw_A7K1cO8-';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentUserProfile = null;
  let isSignUp = false;

  // Инициализация при зареждане
  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      currentUser = session.user;
      await loadUserProfile();
    }
  });

  // Изход
document.getElementById('logout-btn').addEventListener('click', async () => {
  if (realtimeChannel) {
    await supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }
  await supabaseClient.auth.signOut();
  location.reload();
});

  // Превключване Вход / Регистрация
  document.getElementById('toggle-mode-btn').addEventListener('click', () => {
    isSignUp = !isSignUp;
    document.getElementById('username-container').classList.toggle('hidden', !isSignUp);
    document.getElementById('submit-btn').textContent = isSignUp ? 'Изпрати заявка' : 'Вход';
    document.getElementById('toggle-mode-btn').textContent = isSignUp ? 'Вече имате акаунт? Влезте' : 'Нямате акаунт? Поискайте достъп тук.';
  });

  // Форма Вход/Регистрация
  document.getElementById('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const username = document.getElementById('username').value;
    const msgBox = document.getElementById('auth-message');

    if (isSignUp) {
      const { error } = await supabaseClient.auth.signUp({ email, password, options: { data: { username } } });
      if (error) showMsg(msgBox, error.message, 'bg-red-500/20 text-red-400');
      else showMsg(msgBox, 'Заявката е изпратена! Изчакайте админ да ви одобри.', 'bg-green-500/20 text-green-400');
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) showMsg(msgBox, error.message, 'bg-red-500/20 text-red-400');
      else {
        currentUser = data.user;
        await loadUserProfile();
      }
    }
  });

  // Зареждане на профил
async function loadUserProfile() {
  const { data: profile, error } = await supabaseClient
    .from('profiles')
    .select('*')
    .eq('id', currentUser.id)
    .maybeSingle();

  if (error || !profile || !profile.is_approved) {
    await supabaseClient.auth.signOut();
    showMsg(document.getElementById('auth-message'), 'Акаунтът ви не е одобрен от админ!', 'bg-yellow-500/20 text-yellow-400');
    return;
  }

  currentUserProfile = profile;
  document.getElementById('auth-section').classList.add('hidden');
  document.getElementById('dashboard-section').classList.remove('hidden');
  document.getElementById('user-info').classList.remove('hidden');
  document.getElementById('user-name').textContent = profile.username;

  if (profile.is_admin) {
    document.getElementById('admin-panel').classList.remove('hidden');
  }

  await loadDashboardData();
  subscribeToRealtime(); // <-- добавено тук
}

let realtimeChannel = null;

function subscribeToRealtime() {
  if (realtimeChannel) return; // не дублирай канала при повторен login
  realtimeChannel = supabaseClient
    .channel('public-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' },
      (payload) => { console.log('profiles change:', payload); loadDashboardData(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'aura_logs' },
      (payload) => { console.log('aura_logs change:', payload); loadDashboardData(); })
    .subscribe((status) => console.log('subscribe status:', status));
}

  // Зареждане на данни (Класация и Хронология)
  async function loadDashboardData() {
    const { data: profiles, error: pErr } = await supabaseClient
      .from('profiles')
      .select('*')
      .order('aura_points', { ascending: false });

    if (pErr) console.error("Грешка при профили:", pErr);

    const leaderboardBody = document.getElementById('leaderboard-body');
    const targetSelect = document.getElementById('target-user');
    const currentSelectedUser = targetSelect.value;

    leaderboardBody.innerHTML = '';
    targetSelect.innerHTML = '<option value="">Изберете колега...</option>';

    profiles?.forEach((p, index) => {
      const points = Number(p.aura_points) || 0;
      const isPositive = points >= 0;

      const row = `
        <tr class="border-b border-slate-700/50 hover:bg-slate-700/30">
          <td class="p-3 font-bold ${index === 0 ? 'text-amber-400' : 'text-slate-400'}">#${index + 1}</td>
          <td class="p-3 font-medium">${p.username} ${p.is_admin ? '🛡️' : ''}</td>
          <td class="p-3 text-right font-black ${isPositive ? 'text-green-400' : 'text-red-400'}">
            ${points}
          </td>
        </tr>`;
      leaderboardBody.innerHTML += row;

      const option = document.createElement('option');
      option.value = p.id;
      option.textContent = p.username;
      if (p.id === currentSelectedUser) option.selected = true;
      targetSelect.appendChild(option);
    });

    const { data: logs, error: lErr } = await supabaseClient
      .from('aura_logs')
      .select('*, profiles!aura_logs_user_id_fkey(username)')
      .order('created_at', { ascending: false })
      .limit(10);

    if (lErr) console.error("Грешка при логове:", lErr);

    const logsContainer = document.getElementById('logs-container');
    logsContainer.innerHTML = '';

    logs?.forEach(log => {
      const isPositive = log.points >= 0;
      const item = `
        <div class="p-3 bg-slate-900/60 rounded border border-slate-700/50 flex justify-between items-center">
          <div>
            <span class="font-bold text-indigo-300">${log.profiles?.username || 'Потребител'}</span>
            <span class="text-slate-400"> - ${log.reason}</span>
          </div>
          <span class="font-bold ${isPositive ? 'text-green-400' : 'text-red-400'}">
            ${isPositive ? '+' : ''}${log.points}
          </span>
        </div>`;
      logsContainer.innerHTML += item;
    });
  }

  // Админ форма
  document.getElementById('aura-form')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const userId = document.getElementById('target-user').value;
    const points = parseInt(document.getElementById('aura-points').value);
    const reason = document.getElementById('aura-reason').value;

    const { error } = await supabaseClient.from('aura_logs').insert({
      user_id: userId,
      admin_id: currentUser.id,
      points: points,
      reason: reason
    });

    if (!error) {
      document.getElementById('aura-form').reset();
      // Ръчно незабавно презареждане
      await loadDashboardData();
    } else {
      alert('Грешка при добавяне: ' + error.message);
    }
  });

  function showMsg(el, text, classes) {
    el.className = `p-3 rounded mb-4 text-sm font-medium ${classes}`;
    el.textContent = text;
    el.classList.remove('hidden');
  }

  // --- REALTIME АБОНАМЕНТ ---

</script>
</body>
</html>
