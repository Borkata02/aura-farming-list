<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Farming Leaderboard</title>
  <!-- Tailwind CSS за бърз и стилен дизайн -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-xl p-6 shadow-2xl border border-slate-700">
    <h1 class="text-3xl font-extrabold text-center mb-2 text-indigo-400">✨ Aura Tracker</h1>
    <p class="text-slate-400 text-center mb-6 text-sm">Влезте или поискайте достъп</p>

    <!-- Съобщение за статус (грешка/успех) -->
    <div id="message" class="hidden p-3 rounded mb-4 text-sm font-medium"></div>

    <!-- Форма за Вход / Регистрация -->
    <form id="auth-form" class="space-y-4">
      <div>
        <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Имейл</label>
        <input type="email" id="email" required class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded focus:outline-none focus:border-indigo-500">
      </div>

      <div id="username-container" class="hidden">
        <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Потребителско име (Име)</label>
        <input type="text" id="username" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Парола</label>
        <input type="password" id="password" required class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded focus:outline-none focus:border-indigo-500">
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded transition duration-200">
        Вход
      </button>
    </form>

    <div class="mt-4 text-center">
      <button id="toggle-mode-btn" class="text-xs text-indigo-400 hover:underline">
        Нямате акаунт? Поискайте достъп тук.
      </button>
    </div>
  </div>

  <script>
    // 1. КОНФИГУРАЦИЯ НА SUPABASE (Заменете с вашите ключове!)
    const SUPABASE_URL = 'ВАШИЯТ_SUPABASE_URL_ТУК';
    const SUPABASE_ANON_KEY = 'ВАШИЯТ_SUPABASE_ANON_KEY_ТУК';
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Логика на формата
    let isSignUp = false;
    const form = document.getElementById('auth-form');
    const toggleBtn = document.getElementById('toggle-mode-btn');
    const usernameContainer = document.getElementById('username-container');
    const submitBtn = document.getElementById('submit-btn');
    const messageBox = document.getElementById('message');

    // Превключване между "Вход" и "Заявка за достъп"
    toggleBtn.addEventListener('click', () => {
      isSignUp = !isSignUp;
      usernameContainer.classList.toggle('hidden', !isSignUp);
      submitBtn.textContent = isSignUp ? 'Изпрати заявка' : 'Вход';
      toggleBtn.textContent = isSignUp ? 'Вече имате акаунт? Влезте' : 'Нямате акаунт? Поискайте достъп тук.';
      messageBox.classList.add('hidden');
    });

    // Обработка на изпращането
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageBox.classList.add('hidden');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const username = document.getElementById('username').value;

      if (isSignUp) {
        // РЕГИСТРАЦИЯ
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { data: { username } }
        });

        if (error) {
          showMessage(error.message, 'bg-red-500/20 text-red-400 border border-red-500');
        } else {
          showMessage('Заявката е изпратена! Моля, изчакайте админ да одобри акаунта ви.', 'bg-green-500/20 text-green-400 border border-green-500');
          form.reset();
        }
      } else {
        // ВХОД
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          showMessage(error.message, 'bg-red-500/20 text-red-400 border border-red-500');
          return;
        }

        // Проверка дали потребителят е одобрен
        const { data: profile, error: profileError } = await supabase
          .from('profiles')
          .select('is_approved')
          .eq('id', data.user.id)
          .single();

        if (profileError || !profile?.is_approved) {
          await supabase.auth.signOut(); // Излизаме автоматично
          showMessage('Акаунтът ви все още очаква одобрение от админ!', 'bg-yellow-500/20 text-yellow-400 border border-yellow-500');
        } else {
          showMessage('Успешен вход! Пренасочване...', 'bg-green-500/20 text-green-400 border border-green-500');
          // Тук по-нататък ще пренасочим към dashboard-а
        }
      }
    });

    function showMessage(msg, classes) {
      messageBox.className = `p-3 rounded mb-4 text-sm font-medium ${classes}`;
      messageBox.textContent = msg;
      messageBox.classList.remove('hidden');
    }
  </script>
</body>
</html>
